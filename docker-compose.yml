# Local dev services. The API, client, and Postgres run natively (see CLAUDE.md).
services:
  # MailHog for email testing (SMTP server + web UI)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: amr-mailhog-dev
    ports:
      - "1025:1025"   # SMTP server
      - "8025:8025"   # Web UI
    networks:
      - amr-network
    restart: unless-stopped

  # Ollama for local LLM inference (dev only; prod uses Anthropic API)
  ollama:
    image: ollama/ollama:latest
    container_name: amr-ollama-dev
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - amr-network
    restart: unless-stopped

networks:
  amr-network:
    driver: bridge
    name: amr-grand-prix-network

volumes:
  ollama-data:
    name: amr-ollama-data