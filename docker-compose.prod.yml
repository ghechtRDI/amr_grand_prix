# Production stack: Cloudflare -> Caddy (TLS) -> app (.NET API + built SPA) -> Postgres.
# Settings and secrets come from .env next to this file; the deploy workflow renders it
# from GitHub Secrets (see .env.example for every variable).
#
# Local check (serves http://localhost):
#   cp .env.example .env   # fill in the blanks; leave the deployment section at its local values
#   docker compose -f docker-compose.prod.yml up --build -d
#   docker compose -f docker-compose.prod.yml run --rm --entrypoint ./efbundle app

# Own project name so prod commands never touch the dev compose project (mailhog/ollama)
name: amr-grand-prix-prod

services:
  app:
    image: ${APP_IMAGE:-amr-grand-prix:local}
    build:
      context: .
      dockerfile: Dockerfile.production
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    # No published ports: only Caddy, on the internal network, can reach the app
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Prod sets POSTGRES_DATA to the block-storage mount; otherwise a named volume
      - ${POSTGRES_DATA:-pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
      CADDY_TLS: ${CADDY_TLS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]
    networks: [internal]
    restart: unless-stopped

networks:
  internal:
    name: amr-grand-prix-prod

volumes:
  pgdata:
    name: amr-grand-prix-pgdata
  caddy-data:
  caddy-config:
