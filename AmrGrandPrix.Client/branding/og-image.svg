<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    Source for public/og-image.png, the default link-preview image (1200x630). The ridge is the
    landing page's MountainRidge artwork in the dark theme's colors. Regenerate it after editing
    with headless Chrome at a 1200x630 window: see the comment in AmrGrandPrix.Client/branding/README.md.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1b33"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a3a4f7"/>
      <stop offset="1" stop-color="#FECC31"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- Logo mark: the favicon / NavBar mountain -->
  <g transform="translate(80 72)">
    <rect width="64" height="64" rx="12" fill="#FECC31"/>
    <g transform="translate(8 8) scale(2)" fill="none" stroke="#1a1400" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
      <path d="m8 3 4 8 5-5 5 15H2L8 3z"/>
    </g>
  </g>
  <text x="164" y="115" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#e4e4e7">AMR Race Results</text>

  <text x="80" y="238" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-1.5" fill="url(#title)">Alaska Mountain Runners</text>
  <text x="80" y="296" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="400" fill="#a1a1aa">Race results &#183; Grand Prix standings &#183; Athletes</text>

  <!-- Ridge (MountainRidge.jsx, 1440x320 scaled to the full width) -->
  <g transform="translate(0 363.33) scale(0.83333)">
    <circle cx="930" cy="128" r="30" fill="#FECC31" fill-opacity="0.6"/>
    <path d="M0 230 L120 170 L210 205 L340 110 L450 180 L560 130 L700 200 L820 120 L940 175 L1060 90 L1190 170 L1300 135 L1440 190 L1440 320 L0 320 Z" fill="#898AF4" fill-opacity="0.18"/>
    <path d="M0 270 L150 215 L260 245 L420 150 L540 225 L660 185 L780 240 L900 160 L1000 200 L1120 120 L1250 215 L1360 185 L1440 220 L1440 320 L0 320 Z" fill="#898AF4" fill-opacity="0.38"/>
    <path d="M1120 120 L1093 145 L1108 141 L1120 152 L1134 140 L1149 146 Z" fill="#ffffff" fill-opacity="0.85"/>
    <path d="M760 300 C 840 280, 870 250, 940 238 S 1040 200, 1070 172 S 1105 140, 1120 124" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 10"/>
    <path d="M0 300 L180 265 L300 285 L470 230 L620 280 L760 255 L900 290 L1040 250 L1180 285 L1320 260 L1440 280 L1440 320 L0 320 Z" fill="#121212"/>
  </g>
</svg>
