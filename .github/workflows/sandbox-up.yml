# Create the sandbox server (~$5/month while it exists) and deploy the selected branch to
# https://grandprix-sandbox.alaskamountainrunners.org. Starts with an empty database.
# Run sandbox-down.yml when finished: Vultr bills stopped instances, so only destroying
# the server stops the charges.
name: Sandbox up

on:
  workflow_dispatch:

jobs:
  infra:
    uses: ./.github/workflows/_terraform.yml
    permissions:
      contents: read
    with:
      environment: sandbox
      action: apply
    secrets: inherit # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit -- same-repo reusable workflow

  build:
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read
      packages: write

  deploy:
    needs: [infra, build]
    uses: ./.github/workflows/_deploy.yml
    permissions:
      contents: read
      packages: read
    with:
      environment: sandbox
      image: ${{ needs.build.outputs.image }}
      server_ip: ${{ needs.infra.outputs.server_ip }}
      firewall_group_id: ${{ needs.infra.outputs.firewall_group_id }}
    secrets: inherit # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit -- same-repo reusable workflow
