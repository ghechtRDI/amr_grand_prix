name: PR checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x
      - run: dotnet test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AmrGrandPrix.Client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: AmrGrandPrix.Client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.17"
      - run: terraform fmt -check -recursive terraform
      - name: Validate
        run: |
          for env in prod sandbox; do
            terraform -chdir=terraform/environments/$env init -backend=false -input=false
            terraform -chdir=terraform/environments/$env validate
          done
