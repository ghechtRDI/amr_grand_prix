# Push to main: test, build the image, and deploy it to production.
# Does nothing until the repository variable PROD_DEPLOY_ENABLED is "true", which is
# set once production exists (see DOCS/DEPLOYMENT_SETUP.md).
name: Deploy app

on:
  push:
    branches: [main]
    paths:
      - AmrGrandPrix.API/**
      - AmrGrandPrix.Client/**
      - Dockerfile.production
      - Dockerfile.production.dockerignore
      - docker-compose.prod.yml
      - Caddyfile
      - .github/workflows/deploy-app.yml
      - .github/workflows/_build.yml
      - .github/workflows/_deploy.yml
  workflow_dispatch:

jobs:
  test:
    if: vars.PROD_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.x
      - run: dotnet test

  build:
    needs: test
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read
      packages: write

  deploy:
    needs: build
    uses: ./.github/workflows/_deploy.yml
    permissions:
      contents: read
      packages: read
    with:
      environment: production
      image: ${{ needs.build.outputs.image }}
    secrets: inherit # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit -- same-repo reusable workflow
