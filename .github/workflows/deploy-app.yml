# Push to main: test, build the image, and deploy it to production.
# Does nothing until the repository variable PROD_DEPLOY_ENABLED is "true", which is
# set once production exists (see DOCS/DEPLOYMENT_SETUP.md).
name: Deploy app

on:
  push:
    branches: [main]
    paths:
      - AmrGrandPrix.API/**
      - AmrGrandPrix.Client/**
      - Dockerfile.production
      - Dockerfile.production.dockerignore
      - docker-compose.prod.yml
      - Caddyfile
      - .github/workflows/deploy-app.yml
      - .github/workflows/_build.yml
      - .github/workflows/_deploy.yml
  workflow_dispatch:

jobs:
  test:
    if: vars.PROD_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x
      - run: dotnet test

  build:
    needs: test
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read
      packages: write

  deploy:
    needs: build
    uses: ./.github/workflows/_deploy.yml
    permissions:
      contents: read
      packages: read
    with:
      environment: production
      image: ${{ needs.build.outputs.image }}
    secrets: inherit # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit -- same-repo reusable workflow
