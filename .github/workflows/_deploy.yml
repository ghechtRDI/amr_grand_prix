# Reusable: deploy an image to a server created by Terraform.
#
# SSH is closed in the Vultr firewall, so this opens port 22 to the runner's IP for the
# duration of the job and removes the rule afterwards (even on failure). Then it copies
# docker-compose.prod.yml, the Caddyfile, and a .env rendered from this environment's
# secrets, runs the database migrations, and restarts the stack.
#
# GitHub Environment (production / sandbox) settings this reads:
#   vars:    SITE_HOST, CLUB_NOTIFICATION_EMAIL, POSTGRES_DATA (prod only),
#            SERVER_IP and FIREWALL_GROUP_ID (prod only; the sandbox passes them as inputs)
#   secrets: SSH_PRIVATE_KEY, POSTGRES_PASSWORD, JWT_SECRET, ANTHROPIC_API_KEY,
#            TURNSTILE_SECRET_KEY, RESEND_API_KEY
# Repository secret: VULTR_API_KEY
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      image:
        type: string
        required: true
      server_ip:
        description: Defaults to the environment's SERVER_IP variable
        type: string
        default: ""
      firewall_group_id:
        description: Defaults to the environment's FIREWALL_GROUP_ID variable
        type: string
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: https://${{ vars.SITE_HOST }}
    concurrency: deploy-${{ inputs.environment }}
    permissions:
      contents: read
      packages: read
    env:
      HOST: ${{ inputs.server_ip || vars.SERVER_IP }}
      FIREWALL_GROUP_ID: ${{ inputs.firewall_group_id || vars.FIREWALL_GROUP_ID }}
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Open SSH to this runner
        id: firewall
        run: |
          runner_ip=$(curl -fsS https://api.ipify.org)
          rule_id=$(curl -fsS -X POST "https://api.vultr.com/v2/firewalls/$FIREWALL_GROUP_ID/rules" \
            -H "Authorization: Bearer $VULTR_API_KEY" -H "Content-Type: application/json" \
            -d "{\"ip_type\":\"v4\",\"protocol\":\"tcp\",\"subnet\":\"$runner_ip\",\"subnet_size\":32,\"port\":\"22\",\"notes\":\"gha run $GITHUB_RUN_ID\"}" \
            | jq -r '.firewall_rule.id')
          echo "rule_id=$rule_id" >> "$GITHUB_OUTPUT"

      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # A recreated sandbox has a new host key, so trust it on first use
          cat > ~/.ssh/config <<EOF
          Host amrgp
            HostName $HOST
            User deploy
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts_amrgp
            ConnectTimeout 10
          EOF

      - name: Wait for the server
        # A freshly created sandbox needs a few minutes for the firewall rule to apply
        # and cloud-init to install Docker
        run: |
          for i in $(seq 1 60); do
            ssh amrgp true 2>/dev/null && break
            [ "$i" = 60 ] && { echo "Server never accepted SSH"; exit 1; }
            sleep 10
          done
          ssh amrgp cloud-init status --wait

      - name: Render .env
        env:
          IMAGE: ${{ inputs.image }}
          SITE_HOST: ${{ vars.SITE_HOST }}
          POSTGRES_DATA: ${{ vars.POSTGRES_DATA }}
          CLUB_NOTIFICATION_EMAIL: ${{ vars.CLUB_NOTIFICATION_EMAIL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          umask 077
          cat > .env.deploy <<EOF
          APP_IMAGE=$IMAGE
          SITE_ADDRESS=$SITE_HOST
          CADDY_TLS=tls /etc/caddy/certs/origin.pem /etc/caddy/certs/origin.key
          POSTGRES_DATA=$POSTGRES_DATA
          POSTGRES_DB=amr_grand_prix
          POSTGRES_USER=amrgp
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          Jwt__Secret=$JWT_SECRET
          Llm__Anthropic__ApiKey=$ANTHROPIC_API_KEY
          Captcha__SecretKey=$TURNSTILE_SECRET_KEY
          Email__SmtpHost=smtp.resend.com
          Email__SmtpPort=587
          Email__EnableSsl=true
          Email__SmtpUsername=resend
          Email__SmtpPassword=$RESEND_API_KEY
          Email__ClubNotificationEmail=$CLUB_NOTIFICATION_EMAIL
          EOF

      - name: Copy files
        run: |
          scp docker-compose.prod.yml Caddyfile .env.deploy amrgp:/opt/amrgp/
          ssh amrgp 'cd /opt/amrgp && mv .env.deploy .env && chmod 600 .env'

      - name: Migrate and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The job token can pull this repo's image and expires when the job ends
          echo "$GHCR_TOKEN" | ssh amrgp docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          ssh amrgp 'bash -s' <<'EOF'
          set -euo pipefail
          cd /opt/amrgp
          dc="docker compose -f docker-compose.prod.yml"
          $dc pull --quiet app
          $dc up -d --wait db
          # Migrate before the new app starts: it seeds roles on startup
          $dc run --rm --entrypoint ./efbundle app
          $dc up -d --wait --wait-timeout 180 --remove-orphans
          docker logout ghcr.io
          docker image prune -f
          EOF

      - name: Smoke test through Cloudflare
        env:
          SITE_HOST: ${{ vars.SITE_HOST }}
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "https://$SITE_HOST/health"

      - name: Close SSH
        if: always() && steps.firewall.outputs.rule_id != '' && steps.firewall.outputs.rule_id != 'null'
        env:
          RULE_ID: ${{ steps.firewall.outputs.rule_id }}
        run: |
          curl -fsS -X DELETE "https://api.vultr.com/v2/firewalls/$FIREWALL_GROUP_ID/rules/$RULE_ID" \
            -H "Authorization: Bearer $VULTR_API_KEY"
